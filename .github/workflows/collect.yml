name: Recolectar precios

on:
  schedule:
    - cron: "17 */4 * * *"   # cada 4 horas (hora UTC)
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions
  push:
    branches: [main]
    paths: ["collector/**"]   # corre al cambiar el recolector

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests google-auth

      - name: Recolectar
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python collector/collect.py

      - name: Guardar cambios
        run: |
          git config user.name "lootradar-bot"
          git config user.email "lootradar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios de precios"
          else
            git commit -m "Precios $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
